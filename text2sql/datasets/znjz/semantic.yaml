  industry_division:
    label: 行业大类
    code_table: industry_division
    aliases: {软件业: I65, 互联网行业: I64, 研发服务: M73, 科技推广: M75, 建筑装饰: E50, 电子设备制造: C39}
    column: "i.`industry_code`"
    match: prefix
    requires: [i]
  round:
    label: 融资轮次
    code_table: null
    aliases: {种子轮: 种子轮, 天使轮: 天使轮, Pre-A轮: Pre-A轮, A轮: A轮, A+轮: A+轮, Pre-B轮: Pre-B轮, B轮: B轮, B+轮: B+轮, C轮: C轮, Pre-IPO: Pre-IPO, IPO: IPO, 战略投资: 战略投资, 股权投资: 股权投资, 股权转让: 股权转让, 新三板定增: 新三板定增, 新三板: 新三板, 被收购: 被收购, 主板定向增发: 主板定向增发}
    column: "f.`round`"
