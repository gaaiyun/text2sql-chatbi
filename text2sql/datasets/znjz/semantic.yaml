entities:
  enterprise:
    label: 企业
    table: 企业基本信息
    alias: e
    synonyms: [企业, 公司, 厂商, 市场主体]
    default_metric: enterprise_count
    time_dimension: start_year
    joins:
      i: "LEFT JOIN `企业行业代码` i ON i.`eid` = e.`eid`"
    list_columns:
      - {sql: "e.`name`", label: 企业名称}
      - {sql: "e.`district_code`", label: 登记地区代码}
      - {sql: "e.`start_date`", label: 成立日期}
      - {sql: "e.`regist_capi_new`", label: 注册资本（万元）}
      - {sql: "e.`status`", label: 经营状态}
    list_order: "e.`regist_capi_new` DESC, e.`name`"
    list_order_note: 名单默认按注册资本从高到低排列。
  financing:
    label: 融资事件
    table: 融资数据
    alias: f
    synonyms: [融资, 融资事件, 融资记录, 投融资]
    default_metric: event_count
    time_dimension: financing_year
    joins:
      e: "JOIN `企业基本信息` e ON e.`eid` = f.`eid`"
      i: "LEFT JOIN `企业行业代码` i ON i.`eid` = f.`eid`"
    list_columns:
      - {sql: "f.`ename`", label: 企业名称}
      - {sql: "f.`round`", label: 融资轮次}
      - {sql: "f.`round_date`", label: 融资日期}
      - {sql: "COALESCE(f.`amount`, f.`estimated_amount`)", label: 融资金额}
    list_order: "f.`round_date` DESC, f.`ename`"
    list_order_note: 名单默认按融资日期从新到旧排列。
  investment:
    label: 对外投资记录
    table: 投资数据
    alias: v
    synonyms: [对外投资, 投资记录, 参股, 被投企业, 被投资企业]
    default_metric: event_count
    time_dimension: null
    joins:
      e: "JOIN `企业基本信息` e ON e.`eid` = v.`eid`"
      i: "LEFT JOIN `企业行业代码` i ON i.`eid` = v.`eid`"
    list_columns:
      - {sql: "v.`name`", label: 投资方}
      - {sql: "v.`invest_name`", label: 被投企业}
      - {sql: "ROUND(v.`stock_percent` * 100, 2)", label: 持股比例（%）}
      - {sql: "v.`invest_status`", label: 被投企业经营状态}
    list_order: "v.`stock_percent` DESC, v.`invest_name`"
    list_order_note: 名单默认按持股比例从高到低排列。
  bidding:
    label: 招投标记录
    table: 招投标
    alias: b
    synonyms: [招投标, 投标, 中标, 招标, 采购公告, 项目公告, 公告, 项目]
    default_metric: event_count
    time_dimension: bid_year
    assumption: 招投标记录包含招标、采购与结果等各类公告，库中没有“是否中标”字段，按全部记录统计。
    joins:
      e: "JOIN `企业基本信息` e ON e.`eid` = b.`eid`"
      i: "LEFT JOIN `企业行业代码` i ON i.`eid` = b.`eid`"
    list_columns:
      - {sql: "e.`name`", label: 企业名称}
      - {sql: "b.`title`", label: 公告标题}
      - {sql: "b.`publish_time`", label: 发布时间}
      - {sql: "b.`project_bid_money`", label: 项目金额}
    list_requires: [e]
    list_order: "b.`publish_time` DESC, b.`id`"
    list_order_note: 名单默认按发布时间从新到旧排列。
  qualification:
    label: 资质记录
    table: 标签数据
    alias: q
    synonyms: [资质, 资质标签, 荣誉, 认证, 资质证书, 商标资质, 商标]
    default_metric: event_count
    time_dimension: qual_year
    joins:
      e: "JOIN `企业基本信息` e ON e.`eid` = q.`eid`"
      i: "LEFT JOIN `企业行业代码` i ON i.`eid` = q.`eid`"
    list_columns:
      - {sql: "q.`name`", label: 企业名称}
      - {sql: "CAST(q.`year` AS SIGNED)", label: 资质年份}
      - {sql: "q.`state`", label: 资质状态}
      - {sql: "q.`valid_end`", label: 有效期结束}
    list_order: "q.`year` DESC, q.`name`"
    list_order_note: 名单默认按资质年份从新到旧排列。

# 企业详情：主档字段 + 各事件表的计数。先在相关子查询里按 eid 计数，避免多个一对多表 JOIN 放大行数
detail:
  columns:
    - {sql: "e.`name`", label: 企业名称}
    - {sql: "e.`status`", label: 经营状态}
    - {sql: "e.`start_date`", label: 成立日期}
    - {sql: "e.`regist_capi_new`", label: 注册资本（万元）}
    - {sql: "e.`district_code`", label: 登记地区代码}
    - {sql: "e.`econ_kind`", label: 企业类型}
    - {sql: "i.`industry_code`", label: 行业代码}
    - {sql: "(SELECT COUNT(*) FROM `融资数据` fx WHERE fx.`eid` = e.`eid`)", label: 融资事件数}
    - {sql: "(SELECT COUNT(*) FROM `投资数据` vx WHERE vx.`eid` = e.`eid`)", label: 对外投资记录数}
    - {sql: "(SELECT COUNT(*) FROM `招投标` bx WHERE bx.`eid` = e.`eid`)", label: 招投标记录数}
    - {sql: "(SELECT COUNT(*) FROM `标签数据` qx WHERE qx.`eid` = e.`eid`)", label: 资质数量}
  requires: [i]
  order: "e.`name`"
  limit: 5

metrics:
  enterprise_count:
    label: 企业数量
    synonyms: [企业数量, 企业数, 公司数量, 公司数, 多少家企业, 多少家公司, 多少家, 几家, 家数]
    sql:
      enterprise: "COUNT(DISTINCT e.`eid`)"
      financing: "COUNT(DISTINCT f.`eid`)"
      investment: "COUNT(DISTINCT v.`eid`)"
      bidding: "COUNT(DISTINCT b.`eid`)"
      qualification: "COUNT(DISTINCT q.`eid`)"
  event_count:
    label: 记录数
    labels:
      financing: 融资事件数
      investment: 对外投资记录数
      bidding: 招投标记录数
      qualification: 资质数量
    synonyms: [次数, 笔数, 条数, 记录数, 事件数, 多少次, 多少笔, 多少条]
    sql:
      financing: "COUNT(*)"
      investment: "COUNT(*)"
      bidding: "COUNT(*)"
      qualification: "COUNT(*)"
  avg_capital:
    label: 平均注册资本（万元）
    synonyms: [平均注册资本, 注册资本均值, 人均注册资本]
    sql:
      enterprise: "ROUND(AVG(e.`regist_capi_new`), 2)"
  total_capital:
    label: 注册资本合计（万元）
    synonyms: [注册资本总额, 注册资本合计, 总注册资本, 注册资本总和]
    sql:
      enterprise: "ROUND(SUM(e.`regist_capi_new`), 2)"
  max_capital:
    label: 最高注册资本（万元）
    synonyms: [最高注册资本, 最大注册资本]
    sql:
      enterprise: "MAX(e.`regist_capi_new`)"
  financing_amount:
    label: 融资金额合计
    synonyms: [融资金额, 融资总额, 融资规模, 融资金额合计]
    sql:
      financing: "SUM(COALESCE(f.`amount`, f.`estimated_amount`))"
    assumption: 融资金额优先取 amount，为空时用估算金额 estimated_amount 补齐，币种以源数据为准。
  bid_amount:
    label: 项目金额合计
    synonyms: [项目金额, 中标金额, 招投标金额, 项目总金额, 预算金额]
    sql:
      bidding: "ROUND(SUM(b.`project_bid_money`), 2)"
    assumption: project_bid_money 约七成为空，合计只包含有金额的记录，单位以源数据为准。
  invested_company_count:
    label: 被投企业数
    synonyms: [被投企业数, 被投资企业数, 被投企业数量]
    sql:
      investment: "COUNT(DISTINCT v.`invest_eid`)"
  avg_stock_percent:
    label: 平均持股比例（%）
    synonyms: [平均持股比例, 持股比例均值]
    sql:
      investment: "ROUND(AVG(v.`stock_percent`) * 100, 2)"

# 泛化计数词：解析到这些词时使用实体的默认指标
count_words: [数量, 数目, 个数, 多少, 总数, 有几个, 数]

# 同一个词在不同实体下指向不同维度。例如“资质的状态分布”是资质状态，“企业的状态分布”是经营状态；
# “各城市的招投标数量”按项目所在城市，其余实体按企业登记城市。default 用于没有专门映射的实体。
scoped_dimension_words:
  状态: {default: status, qualification: qual_state, investment: invest_status}
  城市: {default: city, bidding: bid_city}
  地市: {default: city, bidding: bid_city}
  各市: {default: city, bidding: bid_city}
  各城市: {default: city, bidding: bid_city}
  各个城市: {default: city, bidding: bid_city}
  地区: {default: district, bidding: bid_city}
  区域: {default: district, bidding: bid_city}
  区县: {default: district}

dimensions:
  status:
    label: 经营状态
    synonyms: [经营状态, 登记状态, 企业状态]
    sql: "e.`status`"
    requires: [e]
  econ_kind:
    label: 企业类型
    synonyms: [企业类型, 经济类型, 公司类型, 企业性质, 经济性质]
    sql: "e.`econ_kind`"
    requires: [e]
  city:
    label: 城市
    synonyms: [登记城市, 注册城市, 企业所在城市, 注册地城市]
    case: {code_table: city, expr: "SUBSTR(e.`district_code`, 1, 4)"}
    requires: [e]
    assumption: 城市按企业登记地（district_code 前四位）划分，不是招投标项目所在地。
  district:
    label: 登记地区代码
    synonyms: [登记地区, 登记区县, 注册地区, 各区]
    sql: "e.`district_code`"
    requires: [e]
    assumption: 按企业登记地区的六位行政区划代码统计，库中没有区县名称表。
  industry_section:
    label: 行业门类
    synonyms: [行业门类, 行业大类, 门类, 大行业]
    case: {code_table: industry_section, expr: "SUBSTR(i.`industry_code`, 1, 1)"}
    requires: [i]
  industry:
    label: 行业代码
    synonyms: [行业, 细分行业, 行业代码, 产业, 所属行业]
    sql: "i.`industry_code`"
    requires: [i]
    assumption: 库中没有行业名称表，按 GB/T 4754 行业代码统计。
  start_year:
    label: 成立年份
    synonyms: [成立年份, 注册年份, 成立时间, 成立年度]
    sql: "YEAR(e.`start_date`)"
    requires: [e]
    time: true
  capital_bucket:
    label: 注册资本区间
    synonyms: [注册资本区间, 注册资本分布, 注册资本分档, 注册资本段, 资本规模分布]
    sql: "CASE WHEN e.`regist_capi_new` IS NULL THEN '未知' WHEN e.`regist_capi_new` < 100 THEN '100万以下' WHEN e.`regist_capi_new` < 500 THEN '100-500万' WHEN e.`regist_capi_new` < 1000 THEN '500-1000万' WHEN e.`regist_capi_new` < 5000 THEN '1000-5000万' ELSE '5000万及以上' END"
    order_sql: "MIN(COALESCE(e.`regist_capi_new`, -1))"
    requires: [e]
    assumption: 注册资本单位为万元，区间左闭右开。
  company:
    label: 企业名称
    # 没有同义词：“哪些企业/最多的企业”由解析器结合排序意图决定是按企业分组还是列名单
    synonyms: []
    sql: "e.`name`"
    group_sql: "e.`eid`, e.`name`"
    requires: [e]
  round:
    label: 融资轮次
    synonyms: [融资轮次, 轮次, 各轮次, 融资阶段]
    sql: "f.`round`"
    requires: [f]
  financing_year:
    label: 融资年份
    synonyms: [融资年份, 融资年度]
    sql: "YEAR(f.`round_date`)"
    requires: [f]
    time: true
  invest_status:
    label: 被投企业经营状态
    synonyms: [被投企业状态, 被投企业经营状态, 被投资企业状态]
    sql: "v.`invest_status`"
    requires: [v]
  bid_year:
    label: 公告年份
    synonyms: [公告年份, 发布年份]
    sql: "YEAR(b.`publish_time`)"
    requires: [b]
    time: true
  bid_month:
    label: 公告月份
    synonyms: [月份, 每月, 月度, 各月, 逐月]
    sql: "DATE_FORMAT(b.`publish_time`, '%Y-%m')"
    requires: [b]
    time: true
  bid_city:
    label: 项目所在城市
    synonyms: [项目所在地, 项目地区, 项目城市, 项目所在城市]
    case: {code_table: city, expr: "SUBSTR(b.`area_code`, 1, 4)"}
    requires: [b]
    assumption: 按招投标项目地区代码（area_code 前四位）划分城市，省外项目归入“其他”。
  qual_year:
    label: 资质年份
    synonyms: [资质年份, 获评年份, 认定年份]
    sql: "CAST(q.`year` AS SIGNED)"
    requires: [q]
    time: true
  qual_state:
    label: 资质状态
    synonyms: [资质状态, 有效状态, 有效期状态]
    sql: "q.`state`"
    requires: [q]
  qual_level:
    label: 资质级别代码
    synonyms: [资质级别, 资质等级]
    sql: "q.`level`"
    requires: [q]

# 泛化时间词：解析到这些词时使用实体的时间维度
time_words: [年份, 年度, 每年, 各年, 历年, 逐年, 趋势, 变化, 按年]

filters:
  active:
    label: 存续企业
    group: status
    synonyms: [存续, 在营, 正常经营, 在业, 存续状态]
    sql: "e.`status` LIKE '存续%'"
    requires: [e]
    assumption: “存续”按 status 前缀匹配，真实取值为 '存续（在营、开业、在册）'。
  cancelled:
    label: 注销企业
    group: status
    synonyms: [注销, 已注销]
    sql: "e.`status` LIKE '%注销%'"
    requires: [e]
    assumption: “注销”匹配所有含“注销”的状态（注销、注销企业、已注销）。
  revoked:
    label: 吊销企业
    group: status
    synonyms: [吊销, 已吊销]
    sql: "e.`status` LIKE '%吊销%'"
    requires: [e]
  has_financing:
    label: 有融资记录
    group: financing_exists
    synonyms: [有融资记录, 有融资, 获得过融资, 获得融资, 融资过, 拿到融资, 有过融资]
    sql: "EXISTS (SELECT 1 FROM `融资数据` fx WHERE fx.`eid` = e.`eid`{time})"
    time_column: "YEAR(fx.`round_date`)"
    requires: [e]
  no_financing:
    label: 没有融资记录
    group: financing_exists
    synonyms: [没有融资记录, 没有融资, 无融资, 未融资, 未获得融资, 没有获得融资, 没有获得过融资]
    sql: "NOT EXISTS (SELECT 1 FROM `融资数据` fx WHERE fx.`eid` = e.`eid`{time})"
    time_column: "YEAR(fx.`round_date`)"
    requires: [e]
  has_bidding:
    label: 有招投标记录
    group: bidding_exists
    synonyms: [有招投标记录, 有招投标, 参与过招投标, 参与招投标, 有投标记录, 参与过投标, 有中标记录, 中过标]
    sql: "EXISTS (SELECT 1 FROM `招投标` bx WHERE bx.`eid` = e.`eid`{time})"
    time_column: "YEAR(bx.`publish_time`)"
    requires: [e]
  no_bidding:
    label: 没有招投标记录
    group: bidding_exists
    synonyms: [没有招投标记录, 没有招投标, 无招投标, 未参与招投标, 没有参与过招投标, 没有参与招投标, 没有投标记录, 没中过标]
    sql: "NOT EXISTS (SELECT 1 FROM `招投标` bx WHERE bx.`eid` = e.`eid`{time})"
    time_column: "YEAR(bx.`publish_time`)"
    requires: [e]
  has_investment:
    label: 有对外投资
    group: investment_exists
    synonyms: [有对外投资, 对外投资过, 有投资记录, 有对外投资记录]
    sql: "EXISTS (SELECT 1 FROM `投资数据` vx WHERE vx.`eid` = e.`eid`)"
    requires: [e]
  no_investment:
    label: 没有对外投资
    group: investment_exists
    synonyms: [没有对外投资, 无对外投资, 没有对外投资记录]
    sql: "NOT EXISTS (SELECT 1 FROM `投资数据` vx WHERE vx.`eid` = e.`eid`)"
    requires: [e]
  has_qualification:
    label: 有资质记录
    group: qualification_exists
    synonyms: [有资质, 拥有资质, 获得资质, 有资质记录, 获得过资质, 有荣誉]
    sql: "EXISTS (SELECT 1 FROM `标签数据` qx WHERE qx.`eid` = e.`eid`{time})"
    time_column: "CAST(qx.`year` AS SIGNED)"
    requires: [e]
  no_qualification:
    label: 没有资质记录
    group: qualification_exists
    synonyms: [没有资质, 无资质, 未获得资质, 没有资质记录]
    sql: "NOT EXISTS (SELECT 1 FROM `标签数据` qx WHERE qx.`eid` = e.`eid`{time})"
    time_column: "CAST(qx.`year` AS SIGNED)"
    requires: [e]
  valid_qualification:
    label: 有效资质
    group: qualification_state
    synonyms: [有效资质, 资质有效, 仍然有效, 有效的]
    sql: "q.`state` = '有效'"
    requires: [q]
  expired_qualification:
    label: 已过期资质
    group: qualification_state
    synonyms: [已过期, 过期, 失效]
    sql: "q.`state` = '过期'"
    requires: [q]
  target_cancelled:
    label: 被投企业已注销
    group: target_status
    synonyms: [被投企业已注销, 注销的被投企业, 被投企业注销]
    sql: "v.`invest_status` LIKE '%注销%'"
    requires: [v]
  full_ownership:
    label: 全资持股
    group: ownership
    synonyms: [全资, 全资子公司, 持股100%]
    sql: "v.`stock_percent` >= 1"
    requires: [v]
  bid_amount_known:
    label: 有项目金额
    group: bid_amount
    synonyms: [有金额, 有项目金额, 金额不为空]
    sql: "b.`project_bid_money` IS NOT NULL"
    requires: [b]

value_maps:
  city:
    label: 登记城市
    code_table: city
    aliases: {广州: "4401", 深圳: "4403", 珠海: "4404", 汕头: "4405", 佛山: "4406", 江门: "4407", 湛江: "4408", 茂名: "4409", 肇庆: "4412", 惠州: "4413", 梅州: "4414", 汕尾: "4415", 河源: "4416", 阳江: "4417", 清远: "4418", 东莞: "4419", 中山: "4420", 潮州: "4451", 揭阳: "4452", 云浮: "4453", 韶关: "4402"}
