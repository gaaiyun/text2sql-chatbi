# znjz 智能制造企业数据库 · 语义层
#
# 这份文件是“业务口径”的唯一出处：
#   - 语义层路径：规则解析器把问题映射到这里的实体/指标/维度/过滤，由编译器生成 SQL；
#   - LLM 路径：tables/rules/relationships 渲染进提示词，value_hint 与真实取值一起注入；
#   - SQL 安全门：whitelist 与 sensitive_columns 来自这里。
# 修改任何口径后运行 `python -m pytest tests/test_catalog.py`，validate() 会按生产 DDL 逐列核对。

version: 1
dataset: znjz
title: 智能制造企业数据库
description: 广东智能制造相关企业的工商登记、行业分类、融资、对外投资、招投标与资质标签数据。
anchor_year: 2026          # “今年 / 近三年”的锚定年份：数据截止到 2026 年上半年
anchor_partial: true       # 锚定年份只有半年数据，趋势结果的最后一期要提示不完整
default_list_limit: 20     # 名单类问题未指定数量时返回的行数
default_top_limit: 10      # “最多的企业”未指定数量时返回的行数

sensitive_columns: [oper_name, oper_name_id, invest_oper_name]

# 领域词：问题一个都不沾时判定为领域外问题（上传的数据集设 open: true，不做这一判断）
domain:
  open: false
  topics: 企业数量、行业分布、融资轮次、招投标趋势、资质状态
  words: [企业, 公司, 行业, 产业, 融资, 投资, 招投标, 投标, 中标, 资质, 注册资本, 成立, 地区, 城市, 区县, 经营, 存续, 注销, 吊销, 轮次, 项目, 公告, 股权]

# SQL 智能体的表召回补充规则
linking:
  # 一张表都没命中时，把全部分析视图交给模型（宽表不在其中）
  fallback: [企业基本信息, 企业行业代码, 融资数据, 投资数据, 招投标, 标签数据]
  # 事件表命中、问题又需要企业属性时，补上企业主表用于关联；宽表独有字段也以它为参照
  anchor:
    table: 企业基本信息
    terms: [企业, 公司, 名称, 城市, 地区, 区县, 注册资本, 成立, 经营状态, 存续, 注销, 吊销, 企业类型]
    reason: 问题需要企业属性，补充企业主表用于关联
  companions:
    - table: 企业行业代码
      terms: [行业, 产业, 门类, 制造业, 建筑业, 信息技术, 科技服务, 软件]
      reason: 问题涉及行业，补充行业视图

# 注入 LLM 提示词的业务规则。语义层路径由编译器保证，不依赖这些文字。
rules:
  - 统计企业数量用 COUNT(DISTINCT eid)；统计融资、投资、招投标、资质等事件数量用 COUNT(*)。
  - 融资、投资、招投标、资质分析优先使用视图 `融资数据`、`投资数据`、`招投标`、`标签数据`。直接使用宽表时必须过滤 cf_id / cinv_id / cbid_id / ct_id IS NOT NULL，否则没有事件的企业的占位行会被计入。
  - 企业经营状态 status 的真实取值是长文本，例如 '存续（在营、开业、在册）'，不存在 '存续' 这样的短值。按关键词用 LIKE 匹配：存续用 status LIKE '存续%'，注销用 LIKE '%注销%'，吊销用 LIKE '%吊销%'。
  - 库中没有行业名称表和行政区划名称表。行业用 industry_code（GB/T 4754，首字母为门类，前三位为大类），地区用六位行政区划代码（前四位为地市，4401 广州、4403 深圳、4406 佛山、4419 东莞）。
  - 招投标 area_code、资质 district_code 等代码列从浮点导入，带 '.0' 后缀（如 '440300.0'），等值比较会匹配不到，按前缀用 LIKE '4403%' 匹配。
  - 投资数据中 eid 是投资方企业，invest_eid / invest_name 是被投资企业；stock_percent 是 0 到 1 的比例，展示百分比时乘以 100。
  - 注册资本 regist_capi_new 单位为万元；融资金额 amount 为空时可用估算金额 estimated_amount 补齐；project_bid_money 单位以源数据为准，跨表汇总金额前必须说明口径。
  - 企业详情类问题先在子查询中按 eid 聚合各事件表，再关联企业主表，避免多个一对多表直接 JOIN 放大行数。
  - 招投标记录包含招标、采购、结果等多类公告，库中没有“是否中标”字段，问“中标”时按全部招投标记录统计并说明口径。

# 表别名：语义层表达式里的 alias.column 必须能按这里找到真实的表和列
aliases:
  e: 企业基本信息
  i: 企业行业代码
  f: 融资数据
  v: 投资数据
  b: 招投标
  q: 标签数据
  fx: 融资数据
  vx: 投资数据
  bx: 招投标
  qx: 标签数据

tables:
  企业基本信息:
    kind: table
    label: 企业主表
    description: 企业工商登记主档，是所有分析的维表。
    grain: 一行一个企业，eid 唯一
    synonyms: [企业信息, 工商信息, 企业主表, 经营状态, 注册资本, 成立日期, 企业类型, 登记地区]
    columns:
      eid: {label: 企业ID, role: id, description: 企业唯一标识（UUID），跨表关联键}
      name: {label: 企业名称, role: text, synonyms: [企业名称, 公司名称, 名称]}
      status: {label: 经营状态, role: dimension, synonyms: [经营状态, 登记状态, 存续, 注销, 吊销], scan_values: true, value_hint: "长文本取值，如 '存续（在营、开业、在册）'；用 LIKE '存续%' 匹配"}
      new_status_code: {label: 经营状态代码, role: dimension}
      econ_kind: {label: 企业类型, role: dimension, synonyms: [企业类型, 经济类型, 公司类型, 经济性质], scan_values: true}
      regist_capi_new: {label: 注册资本（万元）, role: metric, synonyms: [注册资本, 资本规模]}
      regist_capi: {label: 注册资本原文, role: text, description: 带单位的原始文本，如 '100万元人民币'，不适合计算}
      actual_capi: {label: 实缴资本（万元）, role: metric, description: 约七成为空}
      currency_unit: {label: 注册资本币种, role: dimension, scan_values: true}
      start_date: {label: 成立日期, role: time, synonyms: [成立日期, 成立时间, 成立年份, 注册时间]}
      district_code: {label: 登记地区代码, role: dimension, synonyms: [登记地区, 地区, 区县, 城市], value_hint: "六位行政区划代码，不带 .0 后缀；前四位为地市"}
      province_code: {label: 省份代码, role: dimension}
      belong_org: {label: 登记机关, role: text}
      scope: {label: 经营范围, role: text, synonyms: [经营范围, 业务范围, 主营业务]}
      logout_date: {label: 注销日期, role: time}
      logout_reason: {label: 注销原因, role: text}
      revoke_date: {label: 吊销日期, role: time}
      credit_no: {label: 统一社会信用代码, role: id}
      oper_name: {label: 法定代表人, role: text, description: 个人信息，禁止查询}

  企业基本信息_行业代码:
    kind: table
    label: 企业行业宽表
    description: 企业主档附加行业代码列。只需要行业代码时优先用视图 企业行业代码。
    grain: 一行一个企业，eid 唯一
    prefer: 企业行业代码
    columns:
      eid: {label: 企业ID, role: id}
      name: {label: 企业名称, role: text}
      industry_code: {label: 行业代码, role: dimension}
      status: {label: 经营状态, role: dimension}
      district_code: {label: 登记地区代码, role: dimension}

  企业融资信息:
    kind: table
    label: 融资宽表
    description: 企业主档与融资事件左连接后的宽表，包含没有融资的企业的占位行。
    grain: 一行一个企业或一个融资事件；只有 cf_id 非空的行是真实融资事件
    prefer: 融资数据
    columns:
      eid: {label: 企业ID, role: id}
      name: {label: 企业名称, role: text}
      cf_id: {label: 融资事件ID, role: id, description: 为空表示该行是无融资企业的占位行}
      cf_eid: {label: 融资企业ID, role: id}
      ename: {label: 融资企业名称, role: text}
      round: {label: 融资轮次, role: dimension}
      round_date: {label: 融资日期, role: time}
      amount: {label: 融资金额, role: metric}
      estimated_amount: {label: 估算融资金额, role: metric}
      post_money: {label: 投后估值, role: metric}
      newstitle: {label: 融资新闻标题, role: text}

  企业投资股东信息:
    kind: table
    label: 对外投资宽表
    description: 企业对外投资记录宽表，包含没有对外投资的企业的占位行。
    grain: 一行一个企业或一条投资记录；只有 cinv_id 非空的行是真实投资记录
    prefer: 投资数据
    columns:
      name: {label: 投资方企业名称, role: text}
      cinv_id: {label: 投资记录ID, role: id, description: 为空表示占位行}
      cinv_eid: {label: 投资方企业ID, role: id}
      invest_eid: {label: 被投企业ID, role: id}
      invest_name: {label: 被投企业名称, role: text}
      invest_status: {label: 被投企业经营状态, role: dimension}
      stock_percent: {label: 持股比例, role: metric, description: 0 到 1 的比例}
      should_capi_conv: {label: 认缴出资额（换算）, role: metric, description: 只在宽表中存在，视图 投资数据 没有这一列}
      real_capi: {label: 实缴出资额, role: metric}
      cinv_is_history: {label: 是否历史投资, role: dimension}

  招投标信息:
    kind: table
    label: 招投标宽表
    description: 企业招投标记录宽表，包含没有招投标记录的企业的占位行。
    grain: 一行一个企业或一条招投标记录；只有 cbid_id 非空的行是真实记录
    prefer: 招投标
    columns:
      name: {label: 企业名称, role: text}
      cbid_id: {label: 招投标记录ID, role: id, description: 为空表示占位行}
      cbid_eid: {label: 企业ID, role: id}
      role1: {label: 企业角色代码, role: dimension, scan_values: true, description: 企业在公告中的角色代码，只在宽表中存在}
      title: {label: 公告标题, role: text}
      publish_time: {label: 发布时间, role: time}
      area_code: {label: 项目地区代码, role: dimension}
      project_bid_money: {label: 项目金额, role: metric}

  商标资质信息:
    kind: table
    label: 资质标签宽表
    description: 企业资质、荣誉、认证类标签宽表，包含没有资质的企业的占位行。
    grain: 一行一个企业或一条资质记录；只有 ct_id 非空的行是真实记录
    prefer: 标签数据
    columns:
      name: {label: 企业名称, role: text}
      ct_id: {label: 资质记录ID, role: id, description: 为空表示占位行}
      ct_eid: {label: 企业ID, role: id}
      ct_type: {label: 资质类型代码, role: dimension}
      ct_year: {label: 资质年份, role: time}
      ct_state: {label: 资质状态, role: dimension}
      ct_district_code: {label: 资质地区代码, role: dimension}

  企业行业代码:
    kind: view
    label: 企业行业
    description: 每家企业的国民经济行业代码（GB/T 4754-2017）。
    grain: 一行一个企业
    synonyms: [行业, 行业代码, 产业, 行业分类, 细分行业, 门类]
    columns:
      eid: {label: 企业ID, role: id}
      name: {label: 企业名称, role: text}
      industry_code: {label: 行业代码, role: dimension, synonyms: [行业, 行业代码, 产业], value_hint: "如 'I6531'；首字母为门类（C 制造业、E 建筑业、I 信息技术服务、M 科技服务），前三位为大类"}

  融资数据:
    kind: view
    label: 融资事件
    description: 已过滤占位行的融资事件，eid 为获得融资的企业。
    grain: 一行一个融资事件
    synonyms: [融资, 融资事件, 融资记录, 融资轮次, 投资机构, 投融资]
    columns:
      eid: {label: 企业ID, role: id}
      id: {label: 融资事件ID, role: id}
      ename: {label: 企业名称, role: text}
      round: {label: 融资轮次, role: dimension, synonyms: [轮次, 融资轮次], scan_values: true}
      round_type: {label: 轮次类型代码, role: dimension}
      round_date: {label: 融资日期, role: time, synonyms: [融资时间, 融资日期]}
      amount: {label: 融资金额, role: metric, synonyms: [融资金额], description: 约六成为空}
      estimated_amount: {label: 估算融资金额, role: metric}
      currency: {label: 币种, role: dimension, scan_values: true}
      investors: {label: 投资方, role: text, synonyms: [投资机构, 投资方, 投资人]}
      publish_date: {label: 公告日期, role: time}

  投资数据:
    kind: view
    label: 对外投资
    description: 已过滤占位行的对外投资记录；eid 是投资方，invest_eid/invest_name 是被投企业。
    grain: 一行一条投资记录
    synonyms: [对外投资, 投资记录, 股权投资, 被投企业, 参股, 持股]
    columns:
      eid: {label: 投资方企业ID, role: id}
      id: {label: 投资记录ID, role: id}
      name: {label: 投资方企业名称, role: text}
      invest_eid: {label: 被投企业ID, role: id}
      invest_name: {label: 被投企业名称, role: text, synonyms: [被投企业, 被投资企业]}
      invest_status: {label: 被投企业经营状态, role: dimension, scan_values: true, value_hint: "长文本取值，如 '存续（在营、开业、在册）'、'吊销，已注销'；用 LIKE 匹配"}
      invest_start_date: {label: 被投企业成立日期, role: time, description: 不是投资发生日期}
      stock_percent: {label: 持股比例, role: metric, synonyms: [持股比例, 股比], description: 0 到 1 的比例}
      real_capi: {label: 实缴出资额, role: metric}

  招投标:
    kind: view
    label: 招投标记录
    description: 已过滤占位行的招投标公告记录，eid 为参与企业。
    grain: 一行一条招投标公告记录
    synonyms: [招投标, 投标, 中标, 招标, 采购, 公告, 项目]
    columns:
      eid: {label: 企业ID, role: id}
      id: {label: 招投标记录ID, role: id}
      title: {label: 公告标题, role: text, synonyms: [标题, 项目名称]}
      publish_time: {label: 发布时间, role: time, synonyms: [发布时间, 公告时间]}
      area_code: {label: 项目地区代码, role: dimension, synonyms: [项目地区, 项目所在地], value_hint: "带 .0 后缀，如 '440300.0'；按前缀 LIKE '4403%' 匹配"}
      notice_type_main: {label: 公告主类型代码, role: dimension, scan_values: true}
      notice_type_sub: {label: 公告子类型代码, role: dimension}
      project_number: {label: 项目编号, role: text}
      project_bid_money: {label: 项目金额, role: metric, synonyms: [项目金额, 中标金额, 预算金额], description: 约七成为空，单位以源数据为准}

  标签数据:
    kind: view
    label: 资质标签
    description: 已过滤占位行的资质、荣誉、认证记录。
    grain: 一行一条资质记录
    synonyms: [资质, 标签, 荣誉, 认证, 资质证书]
    columns:
      eid: {label: 企业ID, role: id}
      id: {label: 资质记录ID, role: id}
      name: {label: 企业名称, role: text}
      type: {label: 资质类型代码, role: dimension, scan_values: true}
      level: {label: 资质级别代码, role: dimension, scan_values: true}
      year: {label: 资质年份, role: time, description: 浮点存储，如 2023.0}
      publish_date: {label: 发布日期, role: time}
      state: {label: 资质状态, role: dimension, synonyms: [资质状态, 有效, 过期], scan_values: true}
      district: {label: 资质地区名称, role: text, description: 自由文本，写法不统一（广州 / 广州市 / 广东省广州市天河区）}
      district_code: {label: 资质地区代码, role: dimension, value_hint: "带 .0 后缀，按前缀匹配"}
      valid_start: {label: 有效期开始, role: text}
      valid_end: {label: 有效期结束, role: text}

relationships:
  - {from: 企业行业代码.eid, to: 企业基本信息.eid, cardinality: one_to_one}
  - {from: 融资数据.eid, to: 企业基本信息.eid, cardinality: many_to_one}
  - {from: 投资数据.eid, to: 企业基本信息.eid, cardinality: many_to_one, note: 投资方}
  - {from: 投资数据.invest_eid, to: 企业基本信息.eid, cardinality: many_to_one, note: 被投企业，只有部分在库内}
  - {from: 招投标.eid, to: 企业基本信息.eid, cardinality: many_to_one}
  - {from: 标签数据.eid, to: 企业基本信息.eid, cardinality: many_to_one}

