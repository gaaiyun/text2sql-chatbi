name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_site:
        description: "构建并部署 Cloudflare 站点（需要 CLOUDFLARE_API_TOKEN）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.16,<0.17"
      - run: ruff format --check text2sql tests scripts
      - run: ruff check text2sql tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: 单元与集成测试
        run: pytest
      - name: 离线评测门禁（语义层路径，零模型调用）
        run: python -m text2sql eval --gate --quiet
      - name: 敏感信息扫描与部署检查
        run: |
          python scripts/check_security.py
          python scripts/check_deploy_readiness.py

  site:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_site
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" fonttools brotli
      - run: python scripts/build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 部署到 Cloudflare Workers
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 deploy
