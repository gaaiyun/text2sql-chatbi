[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql-analysis"
version = "2.0.0"
description = "面向智能制造企业数据的 Text2SQL / ChatBI 智能体：语义层与 SQL 智能体双路径、sqlglot 列级安全门、LangGraph 工作流、MCP server、执行准确率评测"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gaaiyun" }]
# 与 requirements.txt 保持一致（Streamlit Cloud 只读 requirements.txt），由 tests/test_packaging.py 校验
dependencies = [
    "sqlglot>=30.8,<31",
    "duckdb>=1.1,<2",
    "pyarrow>=15",
    "langgraph>=1.0,<2",
    "openai>=1.40,<4",
    "mcp>=2.2,<3",
    "PyMySQL>=1.1",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "altair>=5.0",
    "streamlit>=1.40,<2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.16,<0.17", "httpx>=0.27"]

[project.scripts]
text2sql = "text2sql.cli:main"
text2sql-mcp = "text2sql.mcp_server:main"

[tool.setuptools.packages.find]
include = ["text2sql*"]

[tool.setuptools.package-data]
text2sql = ["datasets/*/*.yaml", "datasets/*/*.jsonl", "datasets/*/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["legacy", "output", "data", ".git", ".venv"]
addopts = "-q"
markers = ["slow: 端到端或需要构建演示库的较慢测试"]

[tool.coverage.run]
source = ["text2sql"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["legacy", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# 中文提示词与 SQL 模板经常超过行宽，交给 formatter 处理，不作为 lint 错误
ignore = ["E501", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["text2sql"]
